name: Daily Anime Pilgrimage Update V2

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-anime-pilgrimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager

      - name: Refresh apiid.json
        run: |
          cd pic/data
          python ../../extract_apiid.py --base-dir .
          cd ../..
          cp pic/data/apiid.json .

      - name: Run Anime Pilgrimage V2 scraper
        run: |
          python anime_pilgrimage_v2_scraper.py --auto --max-anime 100 --fix-coords --base-dir pic/data

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "Daily anime pilgrimage update (v2): $(date +'%Y-%m-%d')"
            git push https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi
