name: Anitabi Web Points Update

# 增量爬取 anitabi 网页版巡礼点 (网页版数据比 API 更完整)
#
# 功能:
#   1. 发现新番剧 (主页 mapApp.bangumis 含全部 1400+ 部番剧)
#   2. 增量更新已有番剧的新巡礼点 (按 point id 去重)
#   3. 下载新巡礼点图片 (浏览器 canvas 绕过 Cloudflare)
#   4. 重新生成 index.json
#
# ╔══════════════════════════════════════════════════════════╗
# ║  ⚙️ 调整入口: 在下方 ENV 配置区修改 MAX_NEW / MAX_UPDATE   ║
# ║  定时运行用 ENV 默认值; 手动触发可在 inputs 里临时调整     ║
# ╚══════════════════════════════════════════════════════════╝

on:
  schedule:
    # 每周一 06:00 UTC 运行 (避开日/月更新器的高峰)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # 允许手动触发
    inputs:
      max_new:
        description: '本次最多新增多少部新番剧 (建议 ≤20, 太多会撑爆磁盘)'
        required: false
        default: '10'
      max_update:
        description: '本次最多增量更新多少部已有番剧 (0=全部, 建议 ≤30)'
        required: false
        default: '20'

# ════════════════════════════════════════════════════════════
# ⚙️ 定时运行默认值 (修改这里调整每周自动运行的批次大小)
# ════════════════════════════════════════════════════════════
env:
  MAX_NEW: '10'        # 每次最多新增新番剧数 (磁盘/推送体积考量, 建议 ≤20)
  MAX_UPDATE: '20'     # 每次最多增量更新已有番剧数 (0=全部, 建议 ≤30)

jobs:
  anitabi-web-update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo swapoff -a && sudo rm -f /mnt/swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium /usr/share/miniconda /opt/microsoft /usr/local/graalvm
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/az /opt/google /usr/local/sqlpackage
          sudo rm -rf /usr/share/kotlinc /usr/share/gradle-* /usr/share/sbt /usr/share/ri
          sudo rm -rf /usr/local/n /usr/local/julia* /usr/share/az_diag /usr/share/az_*
          sudo rm -rf /home/linuxbrew /usr/local/.rustup /usr/local/.cargo /usr/local/share/vcpkg
          sudo rm -rf /usr/local/share/edge_driver /usr/local/share/gecko_driver /usr/local/share/chromedriver-linux64
          sudo rm -rf /usr/local/lib/heroku /opt/pipx /snap
          sudo rm -rf /usr/share/doc/* /usr/share/man/* /var/lib/apt/lists/* /var/cache/debconf
          sudo snap remove --purge lxd 2>/dev/null || true
          sudo snap remove --purge core20 2>/dev/null || true
          sudo snap remove --purge snapd 2>/dev/null || true
          docker image prune --all --force || true
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' '^clang-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli firefox microsoft-edge-stable powershell mono-devel apache2 nginx mercurial xvfb --fix-missing 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean
          rm -rf ~/.cache/pip ~/.npm ~/.cache/yarn ~/.gradle/caches ~/.m2/repository

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Chrome + WebGL dependencies
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          # anitabi 地图使用 WebGL, 无头环境用 swiftshader 软件渲染 (Chrome 自带)
          sudo apt-get install -y libgl1-mesa-dri libglu1-mesa libegl-mesa0 || \
          sudo apt-get install -y libgl1-mesa-dri libglu1-mesa libegl1-mesa || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests webdriver-manager

      - name: Refresh apiid.json
        run: |
          cd pic/data
          python ../../extract_apiid.py --base-dir .
          cd ../..
          cp pic/data/apiid.json .

      - name: Resolve ChromeDriver path
        id: driver
        run: |
          python -c "from webdriver_manager.chrome import ChromeDriverManager; print(ChromeDriverManager().install())" > /tmp/wdm.txt
          WDM_PATH=$(cat /tmp/wdm.txt)
          DRIVER_DIR=$(dirname "$WDM_PATH")
          REAL_DRIVER="$DRIVER_DIR/chromedriver"
          if [ -f "$REAL_DRIVER" ]; then
            chmod +x "$REAL_DRIVER"
            echo "path=$REAL_DRIVER" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Anitabi Web Points Updater
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: |
          # 手动触发用 inputs 值, 定时运行用 ENV 默认值
          MAX_NEW_VAL="${{ github.event.inputs.max_new || env.MAX_NEW }}"
          MAX_UPDATE_VAL="${{ github.event.inputs.max_update || env.MAX_UPDATE }}"
          echo "本次配置: max_new=$MAX_NEW_VAL max_update=$MAX_UPDATE_VAL"
          ARGS="--discover --max-new $MAX_NEW_VAL --max-update $MAX_UPDATE_VAL --chrome-path $CHROME_PATH"
          DRIVER_PATH="${{ steps.driver.outputs.path }}"
          if [ -n "$DRIVER_PATH" ]; then
            ARGS="$ARGS --driver-path $DRIVER_PATH"
          fi
          python anitabi_web_updater.py $ARGS 2>&1 | tail -200 | tee /tmp/updater_summary.txt

      - name: Repair unlocalized covers
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: |
          ARGS="--repair-covers --chrome-path $CHROME_PATH"
          DRIVER_PATH="${{ steps.driver.outputs.path }}"
          if [ -n "$DRIVER_PATH" ]; then
            ARGS="$ARGS --driver-path $DRIVER_PATH"
          fi
          python anitabi_web_updater.py $ARGS 2>&1 | tail -50 | tee -a /tmp/updater_summary.txt

      - name: Send Bark notification
        if: always()
        run: |
          SUMMARY=$(cat /tmp/updater_summary.txt 2>/dev/null | tail -10 || echo "无输出")
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.stdin.read()))" <<< "$SUMMARY")
          curl -s "${{ secrets.BARK_URL || 'https://api.day.app/FXxtHPEhbvdzxrgRpBW7E' }}/Anitabi网页巡礼更新/${ENCODED}" || true

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        run: |
          rm -f anime_pilgrimage_scraper.lock anitabi_updater.lock anitabi_web_updater.log
          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "Anitabi web points update: $(date +'%Y-%m-%d')"
            git push https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi
