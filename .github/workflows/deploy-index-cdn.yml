name: Deploy index.json to index-cdn Worker
on:
  push:
    branches: [ main ]
    paths:
      - index.json
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node & Install Wrangler
        run: npm install -g wrangler@latest

      - name: Create tiny worker entry
        run: echo 'export default {async fetch(req, env){return env.ASSETS.fetch(req);}};' > worker-index.js

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy --name index-cdn --compatibility-date 2026-07-01 worker-index.js --assets index.json
