name: Deploy index.json Static Asset to index-cdn Worker
on:
  push:
    branches: [ main ]
    paths:
      - 'index.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Generate worker script
        run: echo 'export default {async fetch(r,e){return e.ASSETS.fetch(r)}};' > worker-index.js

      - name: Publish index-cdn Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler deploy \
            --name index-cdn \
            --account-id $CF_ACCOUNT_ID \
            --compatibility-date 2026-07-01 \
            worker-index.js \
            --assets index.json
