name: CDN图片全量同步部署7组Cloudflare Worker
run-name: 资源同步并部署CDN Worker
on:
  push:
    branches: [ main ]
    paths:
      - 'pic/data/**'
  workflow_dispatch:

env:
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  check_resource_change:
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.diff_detect.outputs.has_change }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检测pic/data目录是否存在文件变更
        id: diff_detect
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            CHANGE_CONTENT=$(git diff --name-only HEAD^ HEAD -- pic/data/)
          else
            CHANGE_CONTENT=$(git ls-files -- pic/data/)
          fi

          if [ -n "$CHANGE_CONTENT" ]; then
            echo "has_change=true" >> $GITHUB_OUTPUT
            echo "检测到资源变更，开始执行部署流程"
          else
            echo "has_change=false" >> $GITHUB_OUTPUT
            echo "无任何资源变更，直接终止工作流"
          fi

  deploy_cdn_workers:
    needs: check_resource_change
    if: needs.check_resource_change.outputs.has_change == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group:
          - { min: 1,    max: 399,   worker_name: cdn-worker-1 }
          - { min: 400,  max: 749,   worker_name: cdn-worker-2 }
          - { min: 750,  max: 999,   worker_name: cdn-worker-3 }
          - { min: 1000, max: 1999,  worker_name: cdn-worker-4 }
          - { min: 2000, max: 5999,  worker_name: cdn-worker-5 }
          - { min: 6000, max: 6399,  worker_name: cdn-worker-6 }
          - { min: 6400, max: 99999, worker_name: cdn-worker-7 }

    steps:
      - name: 拉取主仓库完整代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 为当前Worker构建独立打包目录
        run: |
          WORK_BUILD_DIR=./tmp_build/${{ matrix.group.worker_name }}
          rm -rf ${WORK_BUILD_DIR}
          mkdir -p ${WORK_BUILD_DIR}/public/pic/data
          mkdir -p ${WORK_BUILD_DIR}/src

          find ./pic/data -maxdepth 1 -type d -regex './pic/data/[0-9]+' | while read -r dir; do
            ID=$(basename "$dir")
            if [[ "$ID" =~ ^[0-9]+$ && $ID -ge ${{ matrix.group.min }} && $ID -le ${{ matrix.group.max }} ]]; then
              echo "复制目录：$dir 至${{ matrix.group.worker_name }}"
              cp -r "$dir" ${WORK_BUILD_DIR}/public/pic/data/
            fi
          done

          # 生成JS入口文件（修复EOF语法）
          cat > ${WORK_BUILD_DIR}/src/index.js << 'EOF'
export default {
  async fetch(request, env) {
    return env.ASSETS.fetch(request);
  }
}
EOF

          # 生成wrangler配置文件（修复EOF语法）
          cat > ${WORK_BUILD_DIR}/wrangler.toml << EOF
name = "${{ matrix.group.worker_name }}"
main = "src/index.js"
compatibility_date = "2026-07-01"

[static_assets]
directory = "public"
not_found_handling = "none"

[static_assets.rules]
"/pic/data/**" = { cache_control = "public, max-age=2592000, immutable" }
EOF

      - name: 使用Wrangler部署Worker至Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          working-directory: ./tmp_build/${{ matrix.group.worker_name }}
          command: deploy
          timeout-minutes: 15
