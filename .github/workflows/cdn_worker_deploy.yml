name: CDN Python驱动Cloudflare Worker部署
run-name: Python脚本稳定部署，自带重试与异常捕获
on:
  push:
    branches: [ main ]
    paths:
      - 'pic/data/**'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ACTIONS_RUNNER_TRACKING_DISABLED: true
  NODE_DEBUG: ''

jobs:
  pre_clean_disk:
    runs-on: ubuntu-latest
    steps:
      - name: 系统磁盘清理
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY
          rm -rf ~/.config/.wrangler tmp_build

  check_resource_change:
    needs: pre_clean_disk
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.diff_detect.outputs.has_change }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff_detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "has_change=true" >> $GITHUB_OUTPUT
          else
            CHANGE=$(git diff --name-only HEAD^ HEAD -- pic/data/ || git ls-files pic/data/)
            if [ -n "$CHANGE" ]; then
              echo "has_change=true" >> $GITHUB_OUTPUT
            else
              echo "has_change=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy_by_python:
    needs: check_resource_change
    if: needs.check_resource_change.outputs.has_change == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Node与Wrangler
        run: |
          npm install wrangler@3.80.0 -g --quiet

      - name: 使用Python脚本批量部署Worker
        run: python3 deploy_cdn.py
