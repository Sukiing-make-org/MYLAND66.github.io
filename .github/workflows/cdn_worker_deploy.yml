name: CDN调试模式部署（修复环境变量+wrangler命令异常）
run-name: 修复废弃环境变量，正确执行Assets部署
on:
  push:
    branches: [ main ]
    paths:
      - 'pic/data/**'
  workflow_dispatch:

env:
  # 改用官方推荐的新环境变量名称
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  ACTIONS_RUNNER_TRACKING_DISABLED: true
  NODE_DEBUG: ''
  WRANGLER_LOG: none

jobs:
  pre_clean_disk:
    runs-on: ubuntu-latest
    steps:
      - name: 系统磁盘清理
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf $AGENT_TOOLSDIRECTORY
          rm -rf ~/.config/.wrangler

  check_resource_change:
    needs: pre_clean_disk
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.diff_detect.outputs.has_change }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 部署触发判断
        id: diff_detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "has_change=true" >> $GITHUB_OUTPUT
          else
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              CHANGE_CONTENT=$(git diff --name-only HEAD^ HEAD -- pic/data/)
            else
              CHANGE_CONTENT=$(git ls-files -- pic/data/)
            fi
            if [ -n "$CHANGE_CONTENT" ]; then
              echo "has_change=true" >> $GITHUB_OUTPUT
            else
              echo "has_change=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy_cdn_workers:
    needs: check_resource_change
    if: needs.check_resource_change.outputs.has_change == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        group:
          - { min: 1,    max: 399,   worker_name: cdn-worker-1 }
          - { min: 400,  max: 749,   worker_name: cdn-worker-2 }
          - { min: 750,  max: 999,   worker_name: cdn-worker-3 }
          - { min: 1000, max: 1999,  worker_name: cdn-worker-4 }
          - { min: 2000, max: 5999,  worker_name: cdn-worker-5 }
          - { min: 6000, max: 6399,  worker_name: cdn-worker-6 }
          - { min: 6400, max: 99999, worker_name: cdn-worker-7 }
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装wrangler固定稳定版
        run: npm install wrangler@3.80.0 -g

      - name: 分组打包资源
        run: |
          WORK_BUILD_DIR=./tmp_build/${{ matrix.group.worker_name }}
          rm -rf ${WORK_BUILD_DIR}
          mkdir -p ${WORK_BUILD_DIR}/public/pic/data
          mkdir -p ${WORK_BUILD_DIR}/src

          echo 'export default {' > ${WORK_BUILD_DIR}/src/index.js
          echo '  async fetch(request, env) {' >> ${WORK_BUILD_DIR}/src/index.js
          echo '    try {' >> ${WORK_BUILD_DIR}/src/index.js
          echo '      return await env.ASSETS.fetch(request);' >> ${WORK_BUILD_DIR}/src/index.js
          echo '    } catch (e) {' >> ${WORK_BUILD_DIR}/src/index.js
          echo '      return new Response("File Not Found", { status: 404 });' >> ${WORK_BUILD_DIR}/src/index.js
          echo '    }' >> ${WORK_BUILD_DIR}/src/index.js
          echo '  }' >> ${WORK_BUILD_DIR}/src/index.js
          echo '}' >> ${WORK_BUILD_DIR}/src/index.js

          echo 'name = "${{ matrix.group.worker_name }}"' > ${WORK_BUILD_DIR}/wrangler.toml
          echo 'main = "src/index.js"' >> ${WORK_BUILD_DIR}/wrangler.toml
          echo 'compatibility_date = "2026-07-01"' >> ${WORK_BUILD_DIR}/wrangler.toml
          echo '[assets]' >> ${WORK_BUILD_DIR}/wrangler.toml
          echo 'directory = "public"' >> ${WORK_BUILD_DIR}/wrangler.toml
          echo '[assets.rules]' >> ${WORK_BUILD_DIR}/wrangler.toml
          echo '"/pic/data/**" = { cache_control = "public, max-age=2592000, immutable" }' >> ${WORK_BUILD_DIR}/wrangler.toml

          find ./pic/data -maxdepth 1 -type d -regex './pic/data/[0-9]+' | while read -r dir; do
            ID=$(basename "$dir")
            if [[ "$ID" =~ ^[0-9]+$ && $ID -ge ${{ matrix.group.min }} && $ID -le ${{ matrix.group.max }} ]]; then
              cp -r "$dir" ${WORK_BUILD_DIR}/public/pic/data/
            fi
          done

      - name: 检查是否存在静态资源，无资源直接跳过部署
        id: check_asset
        run: |
          if [ -z "$(ls -A ./tmp_build/${{ matrix.group.worker_name }}/public/pic/data/)" ]; then
            echo "has_asset=false" >> $GITHUB_OUTPUT
            echo "当前分组无资源，跳过部署"
          else
            echo "has_asset=true" >> $GITHUB_OUTPUT
          fi

      - name: 执行wrangler部署（进入配置目录执行，规避参数解析bug）
        id: deploy_step
        if: steps.check_asset.outputs.has_asset == 'true'
        run: |
          cd ./tmp_build/${{ matrix.group.worker_name }}
          wrangler deploy --timeout 1200000
        continue-on-error: true

      - name: 强制打印wrangler日志
        run: |
          echo "========== wrangler 运行日志 =========="
          if [ -d ~/.config/.wrangler/logs/ ]; then
            cat ~/.config/.wrangler/logs/*.log
          else
            echo "无wrangler日志文件，以上控制台输出为执行详情"
          fi
          echo "======================================="
